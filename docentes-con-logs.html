<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Docentes - CON LOGS EXTREMOS</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .btn { padding: 10px 20px; margin: 10px; background: #2563eb; color: white; border: none; border-radius: 5px; cursor: pointer; }
    .btn:hover { background: #1e40af; }
    .logs { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 5px; white-space: pre-wrap; font-family: monospace; max-height: 400px; overflow-y: auto; }
    .docentes-table { margin-top: 20px; border-collapse: collapse; width: 100%; }
    .docentes-table th, .docentes-table td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    .docentes-table th { background: #f2f2f2; }
    .error { background: #fee; color: #c00; }
    .success { background: #efe; color: #060; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 Docentes - LOGS EXTREMOS</h1>
    
    <button class="btn" onclick="cargarDocentesConLogs()">🔥 Cargar Docentes con Logs</button>
    <button class="btn" onclick="probarBackend()">🧪 Probar Solo Backend</button>
    <button class="btn" onclick="limpiarTodo()">🗑️ Limpiar Todo</button>
    
    <div id="logs" class="logs" style="display: none;"></div>
    
    <div id="docentes-container">
      <h2>Docentes Cargados:</h2>
      <div id="docentes-count">Ninguno cargado aún</div>
      <table id="docentes-table" class="docentes-table" style="display: none;">
        <thead>
          <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Certificaciones</th>
            <th>Cursos</th>
            <th>Tarifa</th>
            <th>Foto</th>
          </tr>
        </thead>
        <tbody id="docentes-body">
        </tbody>
      </table>
    </div>
  </div>

  <script>
    let logsArray = [];
    
    function log(mensaje) {
      const timestamp = new Date().toISOString();
      const logMessage = `[${timestamp}] ${mensaje}`;
      logsArray.push(logMessage);
      console.log(logMessage);
      
      // Mostrar logs en pantalla
      const logsDiv = document.getElementById('logs');
      logsDiv.style.display = 'block';
      logsDiv.textContent = logsArray.join('\n');
      logsDiv.scrollTop = logsDiv.scrollHeight;
    }
    
    function cargarDocentesConLogs() {
      log('🔥 === INICIANDO CARGA DE DOCENTES CON LOGS ===');
      log('🔥 Limpiando logs anteriores...');
      logsArray = [];
      
      log('🔥 PASO 1: Verificando google.script.run...');
      if (typeof google === 'undefined' || !google.script || !google.script.run) {
        log('❌ ERROR: google.script.run no está disponible');
        return;
      }
      log('✅ google.script.run disponible');
      
      log('🔥 PASO 2: Configurando handlers...');
      
      const successHandler = function(docentes) {
        log('🔥 SUCCESS HANDLER LLAMADO');
        log('🔥 Tipo de respuesta: ' + typeof docentes);
        log('🔥 Es array: ' + Array.isArray(docentes));
        
        if (docentes) {
          log('🔥 Docentes recibidos: ' + docentes.length);
          
          if (docentes.length > 0) {
            log('🔥 PRIMER DOCENTE RECIBIDO:');
            const primer = docentes[0];
            log('   - ID: "' + primer.ID + '"');
            log('   - Nombre: "' + primer.Nombre + '"');
            log('   - Certificaciones: "' + primer.Certificaciones + '"');
            log('   - CursosQueDicta: "' + primer.CursosQueDicta + '"');
            log('   - TarifaHora: ' + primer.TarifaHora);
            log('   - Foto: ' + (primer.Foto ? 'SÍ' : 'NO'));
            
            // Mostrar en tabla
            mostrarDocentesEnTabla(docentes);
          } else {
            log('⚠️ Array de docentes está vacío');
          }
        } else {
          log('❌ Docentes es null o undefined');
        }
        
        document.getElementById('docentes-count').textContent = 
          docentes ? `${docentes.length} docentes cargados` : 'Error: respuesta null';
      };
      
      const failureHandler = function(error) {
        log('❌ FAILURE HANDLER LLAMADO');
        log('❌ Error: ' + error.toString());
        log('❌ Tipo de error: ' + typeof error);
        
        document.getElementById('docentes-count').textContent = 'ERROR: ' + error.toString();
      };
      
      log('🔥 PASO 3: Ejecutando google.script.run.getDocentes()...');
      
      try {
        google.script.run
          .withSuccessHandler(successHandler)
          .withFailureHandler(failureHandler)
          .getDocentes();
        
        log('✅ Llamada a getDocentes() ejecutada (esperando respuesta...)');
      } catch (error) {
        log('❌ ERROR al ejecutar google.script.run: ' + error.toString());
      }
    }
    
    function probarBackend() {
      log('🧪 === PROBANDO SOLO BACKEND ===');
      
      google.script.run
        .withSuccessHandler(function(resultado) {
          log('🧪 BACKEND RESPONSE:');
          log('   - Success: ' + resultado.success);
          log('   - Count: ' + resultado.count);
          log('   - Timestamp: ' + resultado.timestamp);
          
          if (resultado.docentes && resultado.docentes.length > 0) {
            log('🧪 PRIMER DOCENTE DEL BACKEND:');
            const primer = resultado.docentes[0];
            log('   - ID: ' + primer.ID);
            log('   - Nombre: ' + primer.Nombre);
            log('   - Certificaciones: ' + primer.Certificaciones);
            log('   - CursosQueDicta: ' + primer.CursosQueDicta);
            log('   - TarifaHora: ' + primer.TarifaHora);
          }
        })
        .withFailureHandler(function(error) {
          log('❌ ERROR EN BACKEND TEST: ' + error.toString());
        })
        .testBackendDocentesConLogs();
    }
    
    function mostrarDocentesEnTabla(docentes) {
      log('🔥 MOSTRANDO DOCENTES EN TABLA...');
      
      const table = document.getElementById('docentes-table');
      const tbody = document.getElementById('docentes-body');
      
      tbody.innerHTML = '';
      
      docentes.forEach((docente, index) => {
        const row = tbody.insertRow();
        
        row.insertCell(0).textContent = docente.ID || '-';
        row.insertCell(1).textContent = docente.Nombre || '-';
        row.insertCell(2).textContent = docente.Certificaciones || '-';
        row.insertCell(3).textContent = docente.CursosQueDicta || '-';
        row.insertCell(4).textContent = docente.TarifaHora || '0';
        row.insertCell(5).textContent = docente.Foto ? 'SÍ' : 'NO';
        
        if (index < 3) {
          log(`🔥 Fila ${index + 1} agregada: ${docente.Nombre} - Cert: "${docente.Certificaciones}" - Cursos: "${docente.CursosQueDicta}"`);
        }
      });
      
      table.style.display = 'table';
      log('✅ Tabla mostrada con ' + docentes.length + ' filas');
    }
    
    function limpiarTodo() {
      logsArray = [];
      document.getElementById('logs').style.display = 'none';
      document.getElementById('docentes-table').style.display = 'none';
      document.getElementById('docentes-count').textContent = 'Ninguno cargado aún';
    }
    
    // Auto-cargar al abrir la página
    document.addEventListener('DOMContentLoaded', function() {
      log('🔥 Página cargada - Listo para pruebas');
    });
  </script>
</body>
</html>
