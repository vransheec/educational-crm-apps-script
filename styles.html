<style>
  :root {
    --primary: #1e40af;
    --primary-light: #3b82f6;
    --primary-dark: #1e3a8a;
    --secondary: #f8fafc;
    --accent: #22c55e;
    --success: #22c55e;
    --warning: #f59e0b;
    --danger: #ef4444;
    --bg-light: #ffffff;
    --bg-page: #f5f5f5;
    --text-primary: #2c3e50;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --border-color: #e2e8f0;
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    --shadow-lg: 0 10px 25px rgba(0, 0, 0, 0.1);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
    background: var(--bg-page);
    min-height: 100vh;
    color: var(--text-primary);
    -webkit-font-smoothing: antialiased;
  }

  .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

  /* Header con gradiente como el simulador */
  .header {
    display: grid;
    grid-template-rows: auto auto;
    gap: 0px;
    padding: 4px 0px;
    margin: 0px;
    height: fit-content;
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary-light) 100%);
    margin-bottom: 25px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(30, 64, 175, 0.3);
  }

  .header > div:first-child {
    display: flex;
    align-items: flex-start;
    gap: 2px;
    margin: 0px;
    padding: 0px;
  }

  .logo { 
    height: 50px !important; 
    border-radius: 8px;
    transition: transform 0.3s ease;
    display: block;
    line-height: 0;
  }
  
  .logo:hover {
    transform: scale(1.05);
  }

  .nav { 
    display: block;
    width: 100%;
    margin: 0px;
    padding: 8px;
  }

  .nav-link {
    color: rgba(255, 255, 255, 0.9);
    text-decoration: none;
    padding: 4px 8px;
    border-radius: 6px;
    transition: all 0.3s ease;
    font-size: 11px;
    font-weight: 500;
    border: 1px solid rgba(255, 255, 255, 0.2);
    background: rgba(255, 255, 255, 0.1);
  }

  .nav-link:hover {
    color: white;
    background: rgba(255, 255, 255, 0.2);
    border-color: rgba(255, 255, 255, 0.4);
    transform: translateY(-2px);
  }

  .nav-link.active {
    color: white !important;
    background: rgba(255, 255, 255, 0.3) !important;
    border-color: rgba(255, 255, 255, 0.6) !important;
    font-weight: 600 !important;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2) !important;
  }

  /* Additional selectors for active state */
  .nav-link[data-active="true"],
  .nav-link[aria-current="page"] {
    color: white !important;
    background: rgba(255, 255, 255, 0.3) !important;
    border-color: rgba(255, 255, 255, 0.6) !important;
    font-weight: 600 !important;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2) !important;
  }

  /* Cards con mejor sombra */
  .form-card {
    background: var(--bg-light);
    border-radius: 12px;
    padding: 30px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border-color);
    transition: box-shadow 0.3s ease;
  }
  
  .form-card:hover {
    box-shadow: var(--shadow-lg);
  }

  .form-title {
    font-size: 24px;
    margin-bottom: 25px;
    color: var(--primary);
    text-align: center;
    font-weight: 600;
  }

  /* Tabs mejorados */
  .tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 15px;
  }

  .tab {
    background: transparent;
    border: 1px solid var(--border-color);
    color: var(--text-secondary);
    padding: 10px 20px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: 500;
  }

  .tab:hover {
    color: var(--primary);
    border-color: var(--primary-light);
    background: rgba(59, 130, 246, 0.05);
  }

  .tab.active {
    background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
    color: white;
    border-color: var(--primary);
  }

  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* Sections */
  .section {
    margin-bottom: 25px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border-color);
  }

  .section:last-of-type { border-bottom: none; }

  .section-title {
    font-size: 16px;
    color: var(--primary);
    margin-bottom: 15px;
    font-weight: 600;
  }

  .hint {
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  /* Form Grid */
  .form-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
  }

  .form-group { display: flex; flex-direction: column; }
  .form-group.full-width { grid-column: 1 / -1; }

  .form-group label {
    font-size: 13px;
    color: var(--text-secondary);
    margin-bottom: 6px;
    font-weight: 500;
  }

  .form-group input,
  .form-group select,
  .form-group textarea {
    padding: 10px 14px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: white;
    color: var(--text-primary);
    font-size: 14px;
    transition: all 0.3s ease;
  }

  .form-group input:focus,
  .form-group select:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
  }

  /* Checkbox Grid */
  .checkbox-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 10px;
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 10px 14px;
    background: var(--secondary);
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    border: 1px solid var(--border-color);
    transition: all 0.2s;
  }

  .checkbox-label:hover {
    border-color: var(--primary-light);
    background: rgba(59, 130, 246, 0.05);
  }

  .checkbox-label input { accent-color: var(--primary); }

  /* Secciones dinámicas */
  .seccion-row {
    display: flex;
    gap: 10px;
    margin-bottom: 10px;
  }

  .seccion-select { flex: 1; }

  .btn-icon {
    background: var(--secondary);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    width: 42px;
    height: 42px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 16px;
    transition: all 0.2s;
  }

  .btn-icon:hover {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
    transform: scale(1.05);
  }

  /* Buttons con gradiente como el simulador */
  .form-actions { margin-top: 25px; text-align: center; }

  .btn-submit {
    background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
    color: white;
    border: none;
    padding: 14px 40px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 10px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .btn-submit:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
  }

  .btn-submit:active {
    transform: translateY(0);
  }

  .btn-small {
    background: var(--secondary);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
    padding: 6px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    transition: all 0.2s;
  }

  .btn-small:hover {
    background: var(--primary);
    color: white;
    border-color: var(--primary);
  }

  /* Search */
  .search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .search-box input {
    flex: 1;
    padding: 12px 16px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    background: white;
    color: var(--text-primary);
    font-size: 14px;
  }

  .search-box input:focus {
    outline: none;
    border-color: var(--primary-light);
    box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
  }

  .search-box button {
    background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
    color: white;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 500;
    transition: all 0.3s ease;
  }

  .search-box button:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
  }

  /* Tables mejoradas */
  .table-container { overflow-x: auto; }

  .data-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
    table-layout: auto;
  }

  .data-table th,
  .data-table td {
    padding: 14px 12px;
    text-align: left;
    border-bottom: 1px solid var(--border-color);
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .data-table th {
    background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
    color: white;
    font-weight: 600;
    white-space: nowrap;
  }
  
  .data-table td {
    white-space: nowrap;
  }
  
  /* Columnas de certificaciones y cursos con wrap para badges */
  .cell-certificaciones,
  .cell-cursos {
    white-space: normal !important;
    max-width: 400px;
  }

  .data-table th:first-child { border-radius: 8px 0 0 0; }
  .data-table th:last-child { border-radius: 0 8px 0 0; }

  .data-table tr:hover { background: rgba(59, 130, 246, 0.05); }

  .positive { color: var(--success); font-weight: 600; }
  .negative { color: var(--danger); font-weight: 600; }

  /* Badges */
  .badge {
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
  }

  .badge-pagado, .badge-pago.completo { background: #dcfce7; color: #166534; }
  .badge-parcial, .badge-pago.pendiente { background: #fef3c7; color: #92400e; }
  .badge-pendiente { background: #fee2e2; color: #991b1b; }

  /* Modal */
  .modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    backdrop-filter: blur(4px);
  }

  .modal-content {
    background: white;
    border-radius: 12px;
    width: 90%;
    max-width: 900px;
    max-height: 85vh;
    overflow: auto;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    animation: modalSlideIn 0.3s ease;
  }
  
  @keyframes modalSlideIn {
    from {
      opacity: 0;
      transform: translateY(-20px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  .modal-small { max-width: 450px; }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 25px;
    border-bottom: 1px solid var(--border-color);
    background: var(--secondary);
  }

  .modal-header h2 { color: var(--primary); font-size: 18px; }

  .btn-close {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    font-size: 24px;
    cursor: pointer;
    transition: all 0.2s;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-close:hover { 
    color: var(--danger); 
    background: rgba(239, 68, 68, 0.1);
  }

  .modal-body { padding: 25px; }

  /* Toast con animación */
  .toast {
    position: fixed;
    bottom: 30px;
    right: 30px;
    padding: 16px 24px;
    border-radius: 10px;
    color: white;
    font-weight: 500;
    opacity: 0;
    transform: translateY(20px);
    transition: all 0.3s ease;
    z-index: 1001;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
  }

  .toast.show { opacity: 1; transform: translateY(0); }
  .toast.success { background: var(--success); }
  .toast.error { background: var(--danger); }
  .toast.warning { background: var(--warning); color: #333; }

  /* Dashboard Cards con efecto hover */
  .dashboard-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    margin-bottom: 30px;
  }

  .stat-card {
    background: white;
    border-radius: 12px;
    padding: 25px 20px;
    text-align: center;
    box-shadow: var(--shadow);
    border: 1px solid var(--border-color);
    transition: all 0.3s ease;
  }

  .stat-card:hover {
    transform: translateY(-6px);
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
  }

  .stat-card .icon { 
    font-size: 40px; 
    margin-bottom: 12px;
    filter: grayscale(0);
    transition: transform 0.3s ease;
  }
  
  .stat-card:hover .icon {
    transform: scale(1.1);
  }
  
  .stat-card .value { 
    font-size: 32px; 
    font-weight: 700; 
    color: var(--primary);
    background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  
  .stat-card .label { 
    color: var(--text-secondary); 
    font-size: 14px; 
    margin-top: 8px;
    font-weight: 500;
  }

  /* Footer */
  .footer {
    text-align: center;
    padding: 25px 0;
    color: var(--text-muted);
    font-size: 13px;
    margin-top: 30px;
  }

  .footer a {
    color: var(--primary);
    text-decoration: none;
    transition: color 0.2s;
  }

  .footer a:hover { 
    text-decoration: underline;
    color: var(--primary-light);
  }

  /* Loading animation */
  .loading {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 2px solid rgba(255,255,255,0.3);
    border-radius: 50%;
    border-top-color: white;
    animation: spin 0.8s linear infinite;
  }
  
  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  /* Responsive */
  @media (max-width: 768px) {
    .header {
      flex-direction: column;
      padding: 0px 5px;
      gap: 0px;
    }
    .form-card { padding: 20px; }
    .nav { justify-content: center; }
    .dashboard-grid { grid-template-columns: repeat(2, 1fr); }
    .stat-card .value { font-size: 24px; }
  }

  @media (max-width: 480px) {
    .dashboard-grid { grid-template-columns: 1fr; }
    .tabs { flex-wrap: wrap; }
    .container { padding: 10px; }
  }
</style>
